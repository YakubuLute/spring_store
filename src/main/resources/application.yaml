server:
  port: 8081


spring:
  application:
    name: CreatorStore
# Database Information

  datasource:
    url:  ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  # ORM Configuration
  # Hibernate - ORM for Java configuration
  jpa: # JPA - Jakarta
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

